Region: us-east-1
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: t3.medium
  Networking:
    SubnetId: subnet-010977c26143e3853
    ElasticIp: true
  Ssh:
    KeyName: roach
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    ScaledownIdletime: 5
    QueueUpdateStrategy: DRAIN
  SlurmQueues:
    - Name: h100
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5
          InstanceType: p5.48xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0dc57517de388c39b]
        PlacementGroup:
          Enabled: true
    - Name: h100-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5
          InstanceType: p5.48xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0dc57517de388c39b]
        PlacementGroup:
          Enabled: true
    - Name: a100
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p4d
          InstanceType: p4d.24xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0dc57517de388c39b]
        PlacementGroup:
          Enabled: true
    - Name: a100-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p4d
          InstanceType: p4d.24xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0dc57517de388c39b]
        PlacementGroup:
          Enabled: true
    # One queue per AZ: p5.4xlarge capacity comes and goes per zone, and a
    # queue may span zones only without EFA and without managed FSx. A job
    # lists all six partitions and slurm takes the first with a node; FSx is
    # in 1d, so that one comes first, and a node elsewhere reads it across
    # zones (slower, $0.01/GB each way).
    - Name: h100-1d
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0dc57517de388c39b]
        PlacementGroup:
          Enabled: true
    - Name: h100-1a
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0cfd373935a7e13fe]
        PlacementGroup:
          Enabled: true
    - Name: h100-1b
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-09ef36bfe992170fc]
        PlacementGroup:
          Enabled: true
    - Name: h100-1c
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-05346e680b6132946]
        PlacementGroup:
          Enabled: true
    - Name: h100-1e
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-0f561dd1c8d8cec64]
        PlacementGroup:
          Enabled: true
    - Name: h100-1f
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [subnet-08826319e60b90dfb]
        PlacementGroup:
          Enabled: true
    - Name: a10g
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: g5
          InstanceType: g5.2xlarge
          MinCount: 0
          MaxCount: 1
      Networking:
        SubnetIds: [subnet-0dc57517de388c39b]
SharedStorage:
  - Name: fsx
    StorageType: FsxLustre
    MountDir: /fsx
    FsxLustreSettings:
      FileSystemId: fs-09245015f32279013
