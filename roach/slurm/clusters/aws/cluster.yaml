Region: us-east-1
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: t3.medium
  Networking:
    SubnetId: SUBNET_ID
    ElasticIp: true
  Ssh:
    KeyName: roach
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    ScaledownIdletime: 5
    QueueUpdateStrategy: DRAIN
  SlurmQueues:
    - Name: h100
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5
          InstanceType: p5.48xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
        PlacementGroup:
          Enabled: true
    - Name: h100-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5
          InstanceType: p5.48xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
        PlacementGroup:
          Enabled: true
    - Name: a100
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p4d
          InstanceType: p4d.24xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
        PlacementGroup:
          Enabled: true
    - Name: a100-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p4d
          InstanceType: p4d.24xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
        PlacementGroup:
          Enabled: true
    # One queue per AZ: p5.4xlarge capacity comes and goes per zone, and a
    # queue may span zones only without EFA and without managed FSx. A job
    # lists all six partitions and slurm takes the first with a node; FSx is
    # in 1d, so that one comes first, and a node elsewhere reads it across
    # zones (slower, $0.01/GB each way).
    - Name: h100-1d
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
        PlacementGroup:
          Enabled: true
    - Name: h100-1a
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1A]
        PlacementGroup:
          Enabled: true
    - Name: h100-1b
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1B]
        PlacementGroup:
          Enabled: true
    - Name: h100-1c
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1C]
        PlacementGroup:
          Enabled: true
    - Name: h100-1e
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1E]
        PlacementGroup:
          Enabled: true
    - Name: h100-1f
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1F]
        PlacementGroup:
          Enabled: true
    # The same p5.4xlarge as spot: a separate capacity pool from on-demand, and
    # what the 64-vCPU P spot quota allows. Reclaimed with 120 s notice.
    - Name: h100-1d-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
        PlacementGroup:
          Enabled: true
    - Name: h100-1a-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1A]
        PlacementGroup:
          Enabled: true
    - Name: h100-1b-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1B]
        PlacementGroup:
          Enabled: true
    - Name: h100-1c-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1C]
        PlacementGroup:
          Enabled: true
    - Name: h100-1e-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1E]
        PlacementGroup:
          Enabled: true
    - Name: h100-1f-spot
      CapacityType: SPOT
      ComputeResources:
        - Name: p5-4xl
          InstanceType: p5.4xlarge
          MinCount: 0
          MaxCount: 4
          Efa:
            Enabled: true
      Networking:
        SubnetIds: [SUBNET_US_EAST_1F]
        PlacementGroup:
          Enabled: true
    - Name: a10g
      CapacityType: ONDEMAND
      ComputeResources:
        - Name: g5
          InstanceType: g5.2xlarge
          MinCount: 0
          MaxCount: 1
      Networking:
        SubnetIds: [SUBNET_US_EAST_1D]
SharedStorage:
  - Name: fsx
    StorageType: FsxLustre
    MountDir: /fsx
    FsxLustreSettings:
      FileSystemId: FSX_FILESYSTEM_ID
