[project]
name = "roach"
version = "0.0.1"
description = "fearless experiment management"
readme = "README.md"
authors = [{name = "Rishabh Ranjan", email = "rishabhranjan0207@gmail.com"}]
# The base install is what roach.slurm needs, and nothing else: a project that
# only submits jobs should not pull in plotting or mail. The older frameworks
# keep their dependencies in extras.
dependencies = [
	"beartype",
]

[project.optional-dependencies]
queues = ["psutil", "strictfire", "yagmail"]
stores = ["torch"]
paper = ["matplotlib", "seaborn"]
all = ["roach[queues,stores,paper]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
roach = { path = ".", editable = true, extras = ["all"] }

[tool.pixi.dependencies]
python = "3.11.*"
pre-commit = "*"

[tool.pixi.activation]
scripts = ["scripts/activate.sh"]
