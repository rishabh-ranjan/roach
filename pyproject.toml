[project]
name = "roach"
version = "0.2.1"
description = "fearless experiment management"
readme = "README.md"
authors = [{name = "Rishabh Ranjan", email = "rishabhranjan0207@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "beartype",
    "matplotlib",
    "seaborn",
    "pytest",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["roach"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
roach = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"

[tool.pixi.dependencies]
python = "3.12.*"
