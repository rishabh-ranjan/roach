[project]
name = "roach"
version = "0.5.28"
description = "fearless experiment management"
readme = "README.md"
authors = [{name = "Rishabh Ranjan", email = "rishabhranjan0207@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "beartype",
    "matplotlib",
    "pytest",
]

[project.scripts]
ilctop = "roach.slurm.clusters.ilctop:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["roach"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
roach = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest -m 'not slow'"
test-all = "pytest"

[tool.pytest.ini_options]
markers = ["slow: runs the real batch script; for changes to bootstrap.sh or node.sh"]

[tool.pixi.dependencies]
python = "3.12.*"
